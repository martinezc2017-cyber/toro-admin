<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORO - Descargar App</title>

    <!-- SEO & Social -->
    <meta name="description" content="Descarga TORO - Tu app de transporte en Phoenix, Arizona. Viajes seguros y accesibles.">
    <meta property="og:title" content="TORO - Descarga la App">
    <meta property="og:description" content="Tu app de transporte en Phoenix, Arizona">
    <meta property="og:image" content="https://toro-ride.com/assets/og-image.png">
    <meta property="og:url" content="https://toro-ride.com">
    <meta name="twitter:card" content="summary_large_image">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A1A2E 50%, #0A0A0A 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }

        /* Animated glow effect */
        .logo-container {
            position: relative;
            margin-bottom: 32px;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 50%, #D4AF37 100%);
            border-radius: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow:
                0 0 40px rgba(212, 175, 55, 0.4),
                0 0 80px rgba(212, 175, 55, 0.2);
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                box-shadow:
                    0 0 40px rgba(212, 175, 55, 0.4),
                    0 0 80px rgba(212, 175, 55, 0.2);
            }
            to {
                box-shadow:
                    0 0 60px rgba(212, 175, 55, 0.6),
                    0 0 100px rgba(212, 175, 55, 0.3);
            }
        }

        .logo svg {
            width: 64px;
            height: 64px;
            fill: #0A0A0A;
        }

        h1 {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #D4AF37, #F4D03F, #D4AF37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 16px;
            color: #9CA3AF;
            margin-bottom: 40px;
        }

        .referral-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 32px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .referral-badge svg {
            width: 20px;
            height: 20px;
            fill: #22C55E;
        }

        .referral-badge span {
            color: #22C55E;
            font-weight: 600;
            font-size: 14px;
        }

        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 32px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .download-btn.primary {
            background: linear-gradient(135deg, #D4AF37 0%, #F4D03F 100%);
            color: #0A0A0A;
        }

        .download-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
        }

        .download-btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
        }

        .download-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .download-btn svg {
            width: 24px;
            height: 24px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 40px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px 12px;
        }

        .feature-icon {
            width: 40px;
            height: 40px;
            background: rgba(59, 130, 246, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
        }

        .feature-icon svg {
            width: 20px;
            height: 20px;
            fill: #3B82F6;
        }

        .feature span {
            font-size: 12px;
            color: #9CA3AF;
        }

        .footer {
            color: #6B7280;
            font-size: 12px;
        }

        .footer a {
            color: #D4AF37;
            text-decoration: none;
        }

        /* Loading state */
        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.2);
            border-top-color: #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .content.hidden {
            display: none;
        }

        /* Mobile optimizations */
        @media (max-width: 480px) {
            h1 {
                font-size: 36px;
            }

            .features {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }

            .feature {
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading state while detecting device -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Detectando dispositivo...</p>
    </div>

    <div class="container content" id="content">
        <div class="logo-container">
            <div class="logo">
                <svg viewBox="0 0 24 24">
                    <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/>
                </svg>
            </div>
        </div>

        <h1>TORO</h1>
        <p class="tagline">Tu transporte en Phoenix, Arizona</p>

        <!-- Referral badge (shown when code is present) -->
        <div class="referral-badge" id="referralBadge" style="display: none;">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            <span id="referralText">Te invitaron a TORO</span>
        </div>

        <div class="download-buttons">
            <a href="#" class="download-btn primary" id="primaryBtn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
                <span>Descargar para iPhone</span>
            </a>
            <a href="#" class="download-btn secondary" id="secondaryBtn">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17.523 2.376l-2.006 3.456c1.185.655 2.18 1.607 2.896 2.756.73 1.17 1.135 2.504 1.182 3.912H5.405c.047-1.408.452-2.742 1.182-3.912.716-1.149 1.711-2.101 2.896-2.756L7.477 2.376c-.163-.282-.067-.644.215-.807.282-.163.644-.067.807.215l2.052 3.538c.93-.397 1.95-.617 3.017-.617 1.067 0 2.087.22 3.017.617l2.052-3.538c.163-.282.525-.378.807-.215.282.163.378.525.215.807zM10.5 10.5c0-.552-.448-1-1-1s-1 .448-1 1 .448 1 1 1 1-.448 1-1zm5.5 0c0-.552-.448-1-1-1s-1 .448-1 1 .448 1 1 1 1-.448 1-1zM5.25 13.5h13.5c.138 0 .25.112.25.25v7c0 .966-.784 1.75-1.75 1.75H6.75c-.966 0-1.75-.784-1.75-1.75v-7c0-.138.112-.25.25-.25z"/>
                </svg>
                <span>Descargar para Android</span>
            </a>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                </div>
                <span>Phoenix Metro</span>
            </div>
            <div class="feature">
                <div class="feature-icon" style="background: rgba(34, 197, 94, 0.15);">
                    <svg viewBox="0 0 24 24" style="fill: #22C55E;">
                        <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
                    </svg>
                </div>
                <span>Precios Justos</span>
            </div>
            <div class="feature">
                <div class="feature-icon" style="background: rgba(212, 175, 55, 0.15);">
                    <svg viewBox="0 0 24 24" style="fill: #D4AF37;">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
                    </svg>
                </div>
                <span>Seguro</span>
            </div>
        </div>

        <p class="footer">
            <a href="https://toro-ride.com/privacy">Privacidad</a> ·
            <a href="https://toro-ride.com/terms">Términos</a> ·
            <a href="mailto:support@toro-ride.com">Soporte</a>
        </p>
    </div>

    <script>
        // Store URLs - REPLACE THESE WITH YOUR ACTUAL APP STORE URLS
        const APP_STORE_URL = 'https://apps.apple.com/app/toro-rider/id123456789';
        const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.toro.rider';

        // Deep link schemes
        const DEEP_LINK_SCHEME = 'tororider://';

        // Detect device
        function getDeviceType() {
            const ua = navigator.userAgent.toLowerCase();
            if (/iphone|ipad|ipod/.test(ua)) return 'ios';
            if (/android/.test(ua)) return 'android';
            return 'desktop';
        }

        // Get referral code from URL
        function getReferralCode() {
            const path = window.location.pathname;
            const segments = path.split('/').filter(s => s);

            // Check for /invite/CODE or /get/CODE
            if (segments.length >= 2 && (segments[0] === 'invite' || segments[0] === 'get')) {
                return segments[1];
            }

            // Check for query parameter
            const params = new URLSearchParams(window.location.search);
            return params.get('ref') || params.get('code');
        }

        // Try to open app, fallback to store
        function tryOpenApp(referralCode) {
            const device = getDeviceType();
            const storeUrl = device === 'ios' ? APP_STORE_URL : PLAY_STORE_URL;

            // Build deep link with referral code
            let deepLink = DEEP_LINK_SCHEME;
            if (referralCode) {
                deepLink += `invite/${referralCode}`;
            }

            // For mobile: try to open app first
            if (device !== 'desktop') {
                // Show loading
                document.getElementById('loading').classList.add('active');
                document.getElementById('content').classList.add('hidden');

                // Create hidden iframe to try opening app
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = deepLink;
                document.body.appendChild(iframe);

                // Set timeout to redirect to store if app doesn't open
                setTimeout(() => {
                    document.getElementById('loading').classList.remove('active');
                    document.getElementById('content').classList.remove('hidden');

                    // Check if page is still visible (app didn't open)
                    if (!document.hidden) {
                        // App not installed, redirect to store
                        window.location.href = storeUrl;
                    }
                }, 2500);

                // Also try window.location for Universal Links
                setTimeout(() => {
                    window.location.href = deepLink;
                }, 100);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            const device = getDeviceType();
            const referralCode = getReferralCode();

            // Show referral badge if code present
            if (referralCode) {
                document.getElementById('referralBadge').style.display = 'inline-flex';
                document.getElementById('referralText').textContent = `Codigo: ${referralCode}`;
            }

            // Configure buttons based on device
            const primaryBtn = document.getElementById('primaryBtn');
            const secondaryBtn = document.getElementById('secondaryBtn');

            if (device === 'ios') {
                primaryBtn.href = APP_STORE_URL;
                primaryBtn.querySelector('span').textContent = 'Descargar para iPhone';
                secondaryBtn.href = PLAY_STORE_URL;
            } else if (device === 'android') {
                primaryBtn.href = PLAY_STORE_URL;
                primaryBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.523 2.376l-2.006 3.456c1.185.655 2.18 1.607 2.896 2.756.73 1.17 1.135 2.504 1.182 3.912H5.405c.047-1.408.452-2.742 1.182-3.912.716-1.149 1.711-2.101 2.896-2.756L7.477 2.376c-.163-.282-.067-.644.215-.807.282-.163.644-.067.807.215l2.052 3.538c.93-.397 1.95-.617 3.017-.617 1.067 0 2.087.22 3.017.617l2.052-3.538c.163-.282.525-.378.807-.215.282.163.378.525.215.807zM10.5 10.5c0-.552-.448-1-1-1s-1 .448-1 1 .448 1 1 1 1-.448 1-1zm5.5 0c0-.552-.448-1-1-1s-1 .448-1 1 .448 1 1 1 1-.448 1-1zM5.25 13.5h13.5c.138 0 .25.112.25.25v7c0 .966-.784 1.75-1.75 1.75H6.75c-.966 0-1.75-.784-1.75-1.75v-7c0-.138.112-.25.25-.25z"/>
                    </svg>
                    <span>Descargar para Android</span>
                `;
                secondaryBtn.href = APP_STORE_URL;
                secondaryBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                    </svg>
                    <span>Descargar para iPhone</span>
                `;
            } else {
                // Desktop - show both
                primaryBtn.href = APP_STORE_URL;
                secondaryBtn.href = PLAY_STORE_URL;
            }

            // Auto-try to open app on mobile
            if (device !== 'desktop' && referralCode) {
                tryOpenApp(referralCode);
            }
        });
    </script>
</body>
</html>
